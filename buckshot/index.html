<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Buckshot Roulette</title>
    <link rel="stylesheet" href="style.css">
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="buckshot-roulette.icon.png" />
    <link rel="apple-touch-icon" href="buckshot-roulette.apple-touch-icon.png" />
    <style>
        /* Retro In-Game CRT Modal */
        #game-terminal-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 440px;
            background: #0d0e12;
            border: 2px solid #5a1e28;
            box-shadow: 0 0 35px rgba(255, 30, 60, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.9);
            border-radius: 4px;
            padding: 24px;
            z-index: 99999;
            font-family: 'Courier New', Courier, monospace;
            color: #d1d5db;
        }

        #game-terminal-modal::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100000;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .crt-title {
            color: #ff2a4b;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            border-bottom: 1px solid #33151b;
            padding-bottom: 10px;
            margin-bottom: 18px;
            text-shadow: 0 0 8px rgba(255, 42, 75, 0.6);
        }

        .crt-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #141721;
            border: 1px solid #ff2a4b;
            color: #ff2a4b;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 12px;
            transition: all 0.15s ease;
        }

        .crt-btn:hover {
            background: #ff2a4b;
            color: #000;
            box-shadow: 0 0 12px #ff2a4b;
        }

        .crt-input {
            width: 100%;
            padding: 12px;
            background: #050608;
            border: 1px solid #3f4458;
            color: #00ff66;
            font-family: inherit;
            font-size: 16px;
            text-align: center;
            letter-spacing: 6px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 12px;
        }

        .crt-input:focus {
            border-color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .crt-status {
            font-size: 11px;
            color: #8b92a8;
            text-align: center;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .crt-close {
            position: absolute;
            top: 10px;
            right: 14px;
            color: #666;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            z-index: 100001;
        }

        .crt-close:hover { color: #ff2a4b; }
    </style>
</head>

<body>
    <script src="main.js"></script>
    <div id="loading-text" style="color: white; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;">LOADING...</div>
    <canvas id="canvas"> Your browser does not support the canvas tag. </canvas>

    <!-- Игровой CRT Терминал выбора мультиплеера -->
    <div id="game-terminal-modal">
        <span class="crt-close" id="btn-close-modal">✕</span>
        <div class="crt-title">/// SECURE PROTOCOL: MULTIPLAYER ///</div>
        <div style="font-size: 11px; margin-bottom: 14px; text-align: center; color: #888;">
            DIRECT 1V1 P2P TERMINAL LINK
        </div>
        <button class="crt-btn" id="btn-create-room">Создать комнату (Хост)</button>
        <div style="text-align: center; margin: 10px 0; font-size: 10px; color: #555;">--- ИЛИ ВВЕДИТЕ ЧАСТОТУ ---</div>
        <input type="text" class="crt-input" id="input-room-code" placeholder="0000" maxlength="4" />
        <button class="crt-btn" id="btn-join-room" style="border-color: #00ff66; color: #00ff66;">Подключиться</button>
        <div class="crt-status" id="room-status">СИСТЕМА ГОТОВА К ПОДКЛЮЧЕНИЮ</div>
    </div>
    <noscript> Your browser does not support JavaScript. </noscript>
    <div id="status">
        <img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="buckshot-roulette.png" alt="">
        <progress id="status-progress"></progress>
        <div id="status-notice"></div>
    </div>
    <script src="buckshot-roulette.js"></script>
    <!-- multiplayer_bridge disabled -->
    <script>
        const GODOT_CONFIG = {
            "args": [],
            "canvasResizePolicy": 2,
            "ensureCrossOriginIsolationHeaders": false,
            "executable": "buckshot-roulette",
            "experimentalVK": false,
            "fileSizes": {
                "buckshot-roulette.pck": 344705792,
                "buckshot-roulette.wasm": 43444261
            },
            "focusCanvas": false,
            "gdextensionLibs": []
        };
        const GODOT_THREADS_ENABLED = false;
        const engine = new Engine(GODOT_CONFIG);

        function run() {
            const loadingText = document.getElementById('loading-text');
            const statusOverlay = document.getElementById('status');
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');
            loadingText.remove();
            let initializing = true;
            let statusMode = '';

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) {
                    return;
                }
                if (mode === 'hidden') {
                    statusOverlay.remove();
                    initializing = false;
                    return;
                }
                statusOverlay.style.visibility = 'visible';
                statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
            }

            function setStatusNotice(text) {
                while (statusNotice.lastChild) {
                    statusNotice.removeChild(statusNotice.lastChild);
                }
                const lines = text.split('\n');
                lines.forEach((line) => {
                    statusNotice.appendChild(document.createTextNode(line));
                    statusNotice.appendChild(document.createElement('br'));
                });
            }

            function displayFailureNotice(err) {
                console.error(err);
                if (err instanceof Error) {
                    setStatusNotice(err.message);
                } else if (typeof err === 'string') {
                    setStatusNotice(err);
                } else {
                    setStatusNotice('An unknown error occurred.');
                }
                setStatusMode('notice');
                initializing = false;
            }
            const missing = Engine.getMissingFeatures({
                threads: GODOT_THREADS_ENABLED,
            });
            if (missing.length !== 0) {
                if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
                    let serviceWorkerRegistrationPromise;
                    try {
                        serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
                    } catch (err) {
                        serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
                    }
                    // There's a chance that installing the service worker would fix the issue
                    Promise.race([
                        serviceWorkerRegistrationPromise.then((registration) => {
                            if (registration != null) {
                                return Promise.reject(new Error('Service worker already exists.'));
                            }
                            return registration;
                        }).then(() => engine.installServiceWorker()),
                        // For some reason, `getRegistration()` can stall
                        new Promise((resolve) => {
                            setTimeout(() => resolve(), 2000);
                        }),
                    ]).then(() => {
                        // Reload if there was no error.
                        window.location.reload();
                    }).catch((err) => {
                        console.error('Error while registering service worker:', err);
                    });
                } else {
                    // Display the message as usual
                    const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
                    displayFailureNotice(missingMsg + missing.join('\n'));
                }
            } else {
                setStatusMode('progress');
                engine.startGame({
                    'onProgress': function (current, total) {
                        if (current > 0 && total > 0) {
                            statusProgress.value = current;
                            statusProgress.max = total;
                        } else {
                            statusProgress.removeAttribute('value');
                            statusProgress.removeAttribute('max');
                        }
                    },
                }).then(() => {
                    setStatusMode('hidden');
                }, displayFailureNotice);
            }
        };
        window.godotRunStart = run;
    </script>
</body>

</html>
